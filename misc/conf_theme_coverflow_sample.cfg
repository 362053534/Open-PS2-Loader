# OPL 的 Coverflow 示例主题（第二套内置主题，资源与参数对齐 wOPL 的 CF 主题）。
#
# 使用方法：
#   1. 用这些源码编译 OPL。
#   2. 在你的 OPL 设备上创建主题文件夹：  THM/thm_Coverflow/
#   3. 将本文件复制进去并命名为：          THM/thm_Coverflow/conf_theme.cfg
#   4. 在 OPL 中，设置 -> 选择 "Coverflow" 主题。
#
# 封面仍来自你平常的 ART/<游戏ID>_COV.png 文件（无需任何新增）。
# 本主题引用的默认图 settings_bg(兜底背景) / plank / cf_case / cf_apps_case
# 均已内置于 OPL（对齐 wOPL 的 CF 主题资源），因此不需要额外的图片文件。
# 封面占位图沿用默认主题的 cover；cf_ 前缀的外壳是 Coverflow 专用，
# 不会覆盖默认列表主题共用的 case/apps_case。
# 说明：设备图标（MenuIcon）在【内置】Coverflow 主题下会自动使用 wOPL 风格的
# 单设备大图；外部主题如需同样效果，请在主题文件夹放置对应的设备图标 png。
#
# Coverflow 元素正是把游戏列表变成滚动封面轮播的关键。
# 下方已启用倒影与伪 3D 盒装外壳，并配 settings_bg 兜底背景与 plank 底部搁板。
# 采用与自带 conf_theme_OPL.cfg 相同的、以 Tab 缩进的 "sectionN:" 格式。
#
# --- Coverflow 定制参数（顶层键，全部可选）---
# 规则：主题里写了就【优先使用主题的值】；不写则回退到引擎默认值。
# 需要定制时去掉行首的 # 并改成你要的数值。
#
# coverflow_animation_speed=200 # 滑动动画时长，毫秒（默认 200；<=0 关闭动画、瞬间切换）
# coverflow_dim_covers=0        # 非中心封面是否变暗，0/1（默认 0）
# coverflow_preload=2           # 每侧屏幕外预取的封面数（默认 2 = 左右各 2、共 4）
#                               # 预取值不设上限：值越大滚动越顺滑但越吃内存
# 同屏显示的封面数（1..15）。数量越多整排越挤（封面按原生尺寸排布，过多时两端会溢出屏幕）：
coverflow_count=7
# 游戏封面主图基准尺寸 = PS2 标准封面 140×200（下面两项，一般无需改）：
coverflow_cover_width=140
coverflow_cover_height=200
# APPS 页签封面主图基准尺寸 = 正方形 140×140（应用封面通常为正方形），用来反推
# apps 的 case(cf_apps_case)。下面两项一般无需改：
coverflow_apps_cover_width=140
coverflow_apps_cover_height=140
# 中心封面相对基准的等比增减像素：0 = 原生 140×200 点对点显示、无缩放失真；正值放大：
coverflow_center_scale=0
# 非中心封面相对基准的等比增减像素：负值缩小（默认 -70）。case 外壳按内框占比逆向适配封面：
coverflow_noncenter_scale=-70
# 宽屏(16:9)专用的非中心封面增减像素（默认 -30）。宽屏不再自动 +2 封面，而是把两侧封面放大到
# 此值以占满拉宽后的屏幕（-30 → 非中心宽 110，介于 4:3 的 70 与中心 140 之间；越接近 0 越大）。
# 4:3 下不使用此值（仍用 coverflow_noncenter_scale）：
coverflow_widescreen_noncenter_scale=-30
# 相邻封面【中心距】相对封面宽度的额外百分比：中心距 = 封面宽 ×(1 + 此值/100)，即封面之间的
# 间隙 = 封面宽的“此百分比”。封面越大彼此推得越开（非中心封面大小因此兼具控制间隔的功能）。
# 默认 50（间隙 = 封面宽一半）；调大 = 更疏、调小 = 更密，0 = 封面相邻贴合：
coverflow_cover_spacing_percent=50
# 整排封面的水平微调（单位为 1/256 个封面宽），wOPL 的 CF 主题默认为 14：
coverflow_cover_offset=14
# 非中心封面整体压暗（封面主图+case 外壳一并压暗），亮度随滑动动画渐变，1=开：
coverflow_dim_covers=1
# 背景元素：显示当前游戏的背景图(BG art)，尊重"图像设置→背景开关"(gEnableArtBG)；
# 无游戏背景图/背景关时回退到默认兜底背景 settings_bg（两套内置主题共用同一张兜底背景）。
# mask=alphamask：仅当真正画出游戏背景图时才叠加这张 1 像素 alpha 遮罩压暗背景，
# 回退到 settings_bg 时不叠加，避免遮罩影响兜底背景图。
