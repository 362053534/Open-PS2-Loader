# OPL 的 Coverflow 示例主题（Phase 1 Coverflow 移植）。
#
# 使用方法：
#   1. 用这些源码编译 OPL。
#   2. 在你的 OPL 设备上创建主题文件夹：  THM/thm_Coverflow/
#   3. 将本文件复制进去并命名为：          THM/thm_Coverflow/conf_theme.cfg
#   4. 在 OPL 中：设置 -> 选择 "Coverflow" 主题。
#
# 封面仍来自你平常的 ART/<游戏ID>_COV.png 文件（无需任何新增）。
# "cover" 默认图与 "case" / "apps_case" 外壳都已内置于 OPL，
# 因此本主题不需要额外的图片文件。
#
# Coverflow 元素正是把游戏列表变成滚动封面轮播的关键。
# 下方已启用倒影与伪 3D 盒装外壳。
# 采用与自带 conf_theme_OPL.cfg 相同的、以 Tab 缩进的 "sectionN:" 格式。

# --- Coverflow 定制参数（顶层键，全部可选）---
# 规则：主题里写了就【优先使用主题的值】；不写则回退到引擎默认值。
# 下面各行默认是注释掉的（沿用默认值）；需要定制时去掉行首的 # 并改成你要的数值。
#
# coverflow_count=5             # 同屏显示的封面数（1..15，默认 5）
# coverflow_center_scale=30     # 中间封面额外放大的像素数（默认 30，越大中心越突出）
# coverflow_animation_speed=200 # 滑动动画时长，毫秒（默认 200；<=0 关闭动画、瞬间切换）
# coverflow_dim_covers=0        # 非中心封面是否变暗，0/1（默认 0）
# coverflow_preload=4           # 每侧屏幕外预取的封面数（默认 4；例如填 3 = 左右各预读 3、共 6 张）
#                               # 预取值不设上限：值越大滚动越顺滑但越吃内存，填过大导致问题属自负
# coverflow_cover_offset=0      # 整排封面的水平微调（单位为 1/256 个封面宽，默认 0）

