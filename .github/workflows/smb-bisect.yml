name: SMB-bisect-builds

# 为 SMB 模式 FMV 音频杂音排查生成 B1–B4 减法构建 + BASE/CURR 成对诊断构建。
# 每个构建仅把 modules/iopcore/cdvdman/smb_tuning.h 中对应的一个开关置 0，
# 其余与提交 6254970 的行为完全一致。产物打包在 OPNPS2LD-SMB-Bisect 中。
# 排查方法见 notes/smb_fmv_noise_analysis.md。

on:
  push:
  workflow_dispatch:

jobs:
  build-smb-bisect:
    # 基线为提交 6254970 的父提交 edf39ddc（实机验证无杂音）。
    # 该提交实际只改 7 个文件、四类行为变更，因此只需 4 个减法构建。
    # （早期版本的 B4=SHORTREAD_ZEROFILL / B5=OOB_READ_TOLERANT 针对的是
    #    早于 edf39ddc 就存在的语义，与本回归无关，已撤下。）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: B1, switch: SMB_FEAT_ECHO_KEEPALIVE }
          - { id: B2, switch: SMB_FEAT_SOCK_TIMEOUT }
          - { id: B3, switch: SMB_FEAT_TCP_KEEPALIVE }
          - { id: B4, switch: SMB_FEAT_RECONNECT_THREADS }
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Flip switch for ${{ matrix.id }} (${{ matrix.switch }} -> 0)
      run: |
        sed -i "s/#define ${{ matrix.switch }} 1/#define ${{ matrix.switch }} 0/" modules/iopcore/cdvdman/smb_tuning.h
        grep -n "define ${{ matrix.switch }}" modules/iopcore/cdvdman/smb_tuning.h

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile -> make clean release
      run: make --trace clean release

    - name: Rename ELF with bisect tag
      run: |
        mv OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-${{ matrix.switch }}=0.ELF
        ls -l OPNPS2LD-*.ELF

    - name: Upload bisect artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-SMB-Bisect-${{ matrix.id }}
        path: OPNPS2LD-*-B?-*.ELF

  merge-smb-bisect:
    runs-on: ubuntu-latest
    needs: build-smb-bisect
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: OPNPS2LD-SMB-Bisect
          pattern: OPNPS2LD-SMB-Bisect-B*
          delete-merged: true

  # 杂音对照构建（BASE=基线 edf39ddc / CURR=当前 HEAD）×（RELEASE / QUIET / OBSERVE）。
  #
  # 为什么要分三种：
  #   RELEASE: 完全不带调试，用于确认"你的环境里基线当前是否真的无杂音"（基准校验）。
  #   QUIET  : cdvdman 不带 __IOPCORE_DEBUG（逐读 DPRINTF 全空），只用 -DDIAG_OBSERVE=1
  #            打开稀疏观测点，日志仍走 IOP stdout -> udptty。
  #            !! 实测 BASE-QUIET 也会出现杂音 —— 不是打印太多（实测只有 ~5 行/秒），
  #            而是 INGAME_DEBUG 构建链顺手做了两件改变时序的事：
  #              (1) 加载 udptty-ingame.irx（自带 KPRTTY：连 IOP 内核的 kprintf 都会被
  #                  一个 priority-8 线程搬到 UDP 上）+ ioptrap.irx；
  #              (2) Makefile:198 把 SMSTCPIP_INGAME_CFLAGS 清空，游戏内 SMSTCPIP 不再
  #                  是 INGAME_DRIVER 版本 —— PBUF_POOL 25(vs 8)、TCP_WND 32768(vs
  #                  10240)、软件校验和全开、LWIP_UDP 打开。等于换了一整套 TCP/IP 栈。
  #            所以 QUIET 只能用来做"日志内容"对照，不能做"有/无杂音"对照。
  #   OBSERVE: 整机保持 release（不加载 udptty/ioptrap/ps2link，EE 侧无 __DEBUG 打印，
  #            游戏内 SMSTCPIP 仍是 INGAME_DRIVER=1，只额外打开 UDP 与一个 netconn），
  #            日志由 diag_net.c 直接调 ps2ip 的 lwip_sendto 单播到 SMB 服务器 IP:18194，
  #            且每 500ms/64 次读只聚合发一包（稳态 2 包/秒）。这才是可信的杂音对照。
  # ELF 文件名里带树的 7 位 SHA（BASE 应为 edf39ddc），下载时可自证版本没弄错。
  build-compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: BASE-RELEASE, tree: BASE, ref: edf39ddc5dcb8154dcfd53031fac5dc2667e83fd, mode: release }
          - { id: CURR-RELEASE, tree: CURR, ref: "", mode: release }
          - { id: BASE-QUIET, tree: BASE, ref: edf39ddc5dcb8154dcfd53031fac5dc2667e83fd, mode: quiet }
          - { id: CURR-QUIET, tree: CURR, ref: "", mode: quiet }
          - { id: BASE-OBSERVE, tree: BASE, ref: edf39ddc5dcb8154dcfd53031fac5dc2667e83fd, mode: observe }
          - { id: CURR-OBSERVE, tree: CURR, ref: "", mode: observe }
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Save instrumenter (survives the tree switch)
      run: |
        cp -r tools/smb-diag /tmp/smb-diag-tools
        ls -l /tmp/smb-diag-tools

    - name: Checkout ${{ matrix.tree }} tree
      run: |
        set -e
        REF="${{ matrix.ref }}"
        [ -n "$REF" ] || REF="${{ github.sha }}"
        echo "fetching $REF"
        git fetch --depth 1 origin "$REF" || git fetch origin "$REF"
        git checkout -f FETCH_HEAD
        TREE_SHA=$(git rev-parse --short=7 HEAD)
        echo "TREE_SHA=$TREE_SHA" >> $GITHUB_ENV
        echo "::notice::${{ matrix.id }} tree = $TREE_SHA ($(git log -1 --format=%s))"

    - name: Apply read-cadence instrumentation (quiet/observe only)
      if: matrix.mode != 'release'
      run: |
        mkdir -p tools
        cp -r /tmp/smb-diag-tools tools/smb-diag
        python3 tools/smb-diag/instrument.py .
        git --no-pager diff --stat

    # 当前树独有：SMB 内部事件（Echo 耗时 / 重连 / 读延迟统计）。仅 QUIET 模式。
    - name: Enable SMB_DIAG_LOG (current tree, quiet mode)
      if: matrix.mode == 'quiet' && matrix.tree == 'CURR'
      run: |
        sed -i "s/#define SMB_DIAG_LOG 0/#define SMB_DIAG_LOG 1/" modules/iopcore/cdvdman/smb_tuning.h
        grep -n "define SMB_DIAG_LOG" modules/iopcore/cdvdman/smb_tuning.h

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile (release)
      if: matrix.mode == 'release'
      run: |
        set +e
        make --trace clean release > build.log 2>&1
        ret=$?
        if [ $ret -ne 0 ]; then
          echo "build failed with $ret, first errors:"
          grep -n -iE "error|undefined|No rule|assert" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -60 build.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $ret
        fi
        mv OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-tree${{ env.TREE_SHA }}.ELF
        ls -l OPNPS2LD-*.ELF

    - name: "Compile (quiet debug - cdvdman without __IOPCORE_DEBUG)"
      if: matrix.mode == 'quiet'
      run: |
        set +e
        make DEBUG=1 INGAME_DEBUG=1 TTY_APPROACH=UDP CDVDMAN_DEBUG_FLAGS="DIAG_OBSERVE=1" > build.log 2>&1
        ret=$?
        if [ $ret -ne 0 ]; then
          echo "build failed with $ret, first errors:"
          grep -n -iE "error|undefined|No rule|assert" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -60 build.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $ret
        fi
        mv opl.elf OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-tree${{ env.TREE_SHA }}.elf
        ls -l OPNPS2LD-*.elf

    - name: "Compile (observe - release tree, direct-UDP aggregate stats)"
      if: matrix.mode == 'observe'
      run: |
        set +e
        make clean release CDVDMAN_DEBUG_FLAGS="DIAG_OBSERVE=1" SMSTCPIP_INGAME_CFLAGS="INGAME_DRIVER=1 INGAME_DRIVER_UDP=1" > build.log 2>&1
        ret=$?
        if [ $ret -ne 0 ]; then
          echo "build failed with $ret, first errors:"
          grep -n -iE "error|undefined|No rule|assert" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -80 build.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $ret
        fi
        # 自证观测代码真的编进了 SMB 变体（非 SMB 变体应为空目标）
        echo "::notice::diag_net.o CDVDS hits = $(grep -a -c 'CDVDS w=' modules/iopcore/cdvdman/obj.smb/diag_net.o || true)"
        echo "::notice::smb_cdvdman.irx DIAG hits = $(grep -a -c 'CDVDZ ms=' modules/iopcore/cdvdman/smb_cdvdman.irx || true)"
        mv OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-tree${{ env.TREE_SHA }}.ELF
        ls -l OPNPS2LD-*.ELF

    - name: Upload ${{ matrix.id }}
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-SMB-Cmp-${{ matrix.id }}
        path: OPNPS2LD-*-${{ matrix.id }}-tree*.[Ee][Ll][Ff]
