name: SMB-bisect-builds

# 以 362053534-patch-1（f91c3cf）为基础，做 SMB 模式 FMV 音频杂音的 D1/D2/D3 修复尝试。
#
# 背景：这棵分支（arena/…）最早只是用来定位“问题最早由哪个提交引入”的
# （= 6254970 那棵老树），真正的修复要落在 patch-1 上，所以本 workflow 现在的树
# 已经是 patch-1 的内容。定位阶段的证据全部记在 notes/smb_fmv_noise_analysis.md：
#   * OBSERVE 成对日志证明：SMB 读数据面在 BASE / CURR 之间完全没有差异
#     （读耗时、吞吐、补零、短回、停顿全部一致）⇒ 不是“数据变慢/变脏”。
#   * 唯一落在“每一次收包”热路径上的差异：SO_SNDTIMEO/SO_RCVTIMEO 生效后，
#     每次 netconn_recv() 都要走 sys_arch_sem_wait() 的超时分支
#     （6 个额外系统调用 + 2 次 SetAlarm/CancelAlarm），而不再是裸 WaitSema。
#   * 把它优化成“每次 recv 只装一次 alarm”仍然有杂音 ⇒ 不是频率问题，是存在性问题。
#
# 第一轮实机结果：D1 无杂音；D2 概率性杂音（集中在动画最后几秒）；D3 暂时没遇到。
#
# D2 与 D1 的唯一差别就是 smb_Echo() 前后那两组 setsockopt(SO_RCVTIMEO/SO_SNDTIMEO)，
# 而 D3 与 D2 的 Echo 行为完全相同（120s 空闲才发），所以 D3"干净"很可能是样本不够。
# 这一轮不再靠碰运气抓小概率事件，而是：
#   E4 = 把 Echo 频率放大 60 倍（每 2s 空闲就发一次）—— 若 Echo 是元凶，它会明显更吵；
#   E1 = 把 Echo 彻底关掉（要空闲 2 小时才发）—— 反向对照；
#   E2 = 修法：完全不碰 setsockopt，改用 plwip_recv(MSG_DONTWAIT) 自己轮询等回包，
#        数据面与 D1 一模一样，同时保留"服务器失联能被发现并触发重连"。

on:
  push:
  workflow_dispatch:

jobs:
  # 三个零调试 release 参照：
  #   FIX-RELEASE     = 当前 HEAD（第三轮验证过的 E2 配置 = 建议合入 patch-1 的形态）
  #   PATCH1-STOCK    = f91c3cf 原样（应当有杂音）
  #   BASE-RELEASE    = edf39ddc 老基线（应当无杂音）
  build-compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: FIX-RELEASE, tree: FIX, ref: "", mode: release }
          - { id: PATCH1-STOCK, tree: PATCH1, ref: f91c3cffcc151c97ef9175fe81bd9ebdd1094c5c, mode: release }
          - { id: BASE-RELEASE, tree: BASE, ref: edf39ddc5dcb8154dcfd53031fac5dc2667e83fd, mode: release }
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout ${{ matrix.tree }} tree
      run: |
        set -e
        REF="${{ matrix.ref }}"
        [ -n "$REF" ] || REF="${{ github.sha }}"
        echo "fetching $REF"
        git fetch --depth 1 origin "$REF" || git fetch origin "$REF"
        git checkout -f FETCH_HEAD
        TREE_SHA=$(git rev-parse --short=7 HEAD)
        echo "TREE_SHA=$TREE_SHA" >> $GITHUB_ENV
        echo "::notice::${{ matrix.id }} tree = $TREE_SHA ($(git log -1 --format=%s))"

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile (release)
      run: |
        set +e
        make clean release > build.log 2>&1
        ret=$?
        if [ $ret -ne 0 ]; then
          echo "build failed with $ret, first errors:"
          grep -n -iE "error|undefined|No rule|assert" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -80 build.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $ret
        fi
        mv OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-tree${{ env.TREE_SHA }}.ELF
        ls -l OPNPS2LD-*.ELF

    - name: Upload ${{ matrix.id }}
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-SMB-Cmp-${{ matrix.id }}
        path: OPNPS2LD-*-${{ matrix.id }}-tree*.[Ee][Ll][Ff]

  build-smb-bisect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: D1, tag: "NO-SOCKTMO", defines: "SMB_FEAT_SOCK_TIMEOUT=0" }
          - { id: D2, tag: "NO-SOCKTMO+ECHOTMO", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=1" }
          - { id: E2, tag: "NO-SOCKTMO+ECHO-POLL-NB", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=2" }
          - { id: E6, tag: "FORCED-ECHO+SETSOCKOPT", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=1 SMB_FEAT_ECHO_FORCE=1" }
          - { id: E7, tag: "FORCED-ECHO+POLL-NB", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=2 SMB_FEAT_ECHO_FORCE=1" }
          - { id: E1, tag: "ECHO-NEVER", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=1 SMB_ECHO_IDLE_TICKS=3600" }
          - { id: E4, tag: "ECHO-AMPLIFY-2s", defines: "SMB_FEAT_SOCK_TIMEOUT=0 SMB_FEAT_ECHO_TIMEOUT=1 SMB_ECHO_IDLE_TICKS=1" }
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: "Set defines for ${{ matrix.id }} (${{ matrix.defines }})"
      if: matrix.defines != ''
      run: |
        for kv in ${{ matrix.defines }}; do
          n="${kv%%=*}"
          v="${kv##*=}"
          sed -i -E "s/^#define $n .*/#define $n $v/" modules/iopcore/cdvdman/smb_tuning.h
          grep -n "^#define $n" modules/iopcore/cdvdman/smb_tuning.h
        done

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: "Compile -> make clean release ${{ matrix.extra }}"
      run: |
        set +e
        make clean release ${{ matrix.extra }} > build.log 2>&1
        ret=$?
        if [ $ret -ne 0 ]; then
          echo "build failed with $ret, first errors:"
          grep -n -iE "error|undefined|No rule|assert" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -80 build.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $ret
        fi

    - name: Rename ELF with bisect tag
      run: |
        mv OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.id }}-${{ matrix.tag }}.ELF
        ls -l OPNPS2LD-*.ELF

    - name: Upload bisect artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-SMB-Bisect-${{ matrix.id }}
        path: OPNPS2LD-*-${{ matrix.id }}-*.ELF

  merge-smb-bisect:
    runs-on: ubuntu-latest
    needs: build-smb-bisect
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: OPNPS2LD-SMB-Bisect
          pattern: OPNPS2LD-SMB-Bisect-*
          delete-merged: true
