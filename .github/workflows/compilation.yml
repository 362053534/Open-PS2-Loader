name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Compile -> make clean release
      run: make --trace clean release

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload release artifact ELF
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD
        path: |
          OPNPS2LD-*.ELF

    - name: Upload release artifact info
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: INFO
        path: |
          DETAILED_CHANGELOG
          CREDITS
          LICENSE
          README.md

  build-variants:
    strategy:
      fail-fast: false
      matrix:
        extra: [EXTRA_FEATURES=0, EXTRA_FEATURES=1]
        pademu: [PADEMU=0, PADEMU=1]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile -> make ${{ matrix.extra }} ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
      run: |
        make --trace ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
        mv opl.elf OPNPS2LD-${{ env.OPL_VERSION }}-${{ matrix.pademu }}-${{ matrix.extra }}.ELF

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-VARIANTS ${{ matrix.pademu }} ${{ matrix.extra }}
        path: OPNPS2LD*.ELF

  merge-variants:
    runs-on: ubuntu-latest
    needs: build-variants
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: OPNPS2LD-VARIANTS
          pattern: OPNPS2LD-VARIANTS*
          delete-merged: true

  build-lang:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Compile -> make download_lng languages
      run: make --trace download_lng languages

    - name: Create artifact
      run: sh ./lng_pack.sh

    - name: Upload release artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: OPNPS2LD-LANGS
        path: |
          OPNPS2LD-LANGS-*.zip

  build-debug:
    strategy:
      fail-fast: false
      matrix:
        debug: [cdread_diag]
        # container_commit: [":main", "@sha256:7df074b3007f918b81f911e8b21fce1f297eff73ca03508064651ce2c8713570"] Replace with desired docker image hash or tag
        container_commit: [":main"]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew${{ matrix.container_commit }}
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV
        SHORT_COMMIT="${{ matrix.container_commit }}"
        # Extract the last 4 characters
        SHORT_COMMIT=${SHORT_COMMIT: -4}
        echo "SHORT_COMMIT=$SHORT_COMMIT" >> $GITHUB_ENV

    - name: Compile -> make debug
      run: |
        make ${{ matrix.debug }} --trace
        mv opl.elf opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}.elf

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}
        path: opl-*.elf

  merge-debug:
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: OPNPS2LD-DEBUG
          pattern: opl-*
          delete-merged: true

  build-transformers-seek-diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: seek-0-200ms
            fast_ms: 0
            full_ms: 200
          - label: seek-200-0ms
            fast_ms: 200
            full_ms: 0
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - name: Restore legacy SMB reads and select seek timing
      env:
        FAST_MS: ${{ matrix.fast_ms }}
        FULL_MS: ${{ matrix.full_ms }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow
        git show 71271cffb3e1ae54b872b8fa29b505e03cd07be6:modules/iopcore/cdvdman/cdvdman.c > modules/iopcore/cdvdman/cdvdman.c
        git show 71271cffb3e1ae54b872b8fa29b505e03cd07be6:modules/iopcore/cdvdman/scmd.c > modules/iopcore/cdvdman/scmd.c
        git show 71271cffb3e1ae54b872b8fa29b505e03cd07be6:modules/iopcore/cdvdman/streaming.c > modules/iopcore/cdvdman/streaming.c
        python3 - <<'PY'
        import os
        from pathlib import Path

        path = Path("modules/iopcore/cdvdman/cdvdman.c")
        source = path.read_text()
        seek_values = "#define ACCU_FAST_SEEK_MS     0u\n#define ACCU_FULL_SEEK_MS     0u"
        seek_guard = "    if (!accu_have_pos)\n        return 0;"
        assert seek_values in source
        assert seek_guard in source
        source = source.replace(
            seek_values,
            f"#define ACCU_FAST_SEEK_MS     {os.environ['FAST_MS']}u\n"
            f"#define ACCU_FULL_SEEK_MS     {os.environ['FULL_MS']}u",
        )
        source = source.replace(
            seek_guard,
            "    if (!(cdvdman_settings.common.flags & IOPCORE_COMPAT_SLOW_SEEK) || !accu_have_pos)\n"
            "        return 0;",
            1,
        )
        path.write_text(source)
        PY

    - name: Get version
      run: echo "OPL_VERSION=$(make oplversion)" >> "$GITHUB_ENV"

    - name: Compile Transformers seek diagnostic
      run: |
        make DEBUG=1 INGAME_DEBUG=1 all --trace
        mv opl.elf opl-transformers-${{ matrix.label }}-${{ env.OPL_VERSION }}.elf

    - name: Upload Transformers seek diagnostic
      uses: actions/upload-artifact@v7
      with:
        name: opl-transformers-${{ matrix.label }}
        path: opl-transformers-${{ matrix.label }}-*.elf

  release:
    needs: [build, merge-variants, build-lang]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/362053534-patch-1'
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    # 只下载发布所需产物，避免无过滤下载全部（含debug/矩阵中间产物）导致超时失败
    - name: Download OPNPS2LD
      uses: actions/download-artifact@v8
      with:
        name: OPNPS2LD
        path: OPNPS2LD

    - name: Download INFO
      uses: actions/download-artifact@v8
      with:
        name: INFO
        path: INFO

    - name: Download OPNPS2LD-VARIANTS
      uses: actions/download-artifact@v8
      with:
        name: OPNPS2LD-VARIANTS
        path: OPNPS2LD-VARIANTS

    - name: Download OPNPS2LD-LANGS
      uses: actions/download-artifact@v8
      with:
        name: OPNPS2LD-LANGS
        path: OPNPS2LD-LANGS

    - name: Prepare artifacts for release
      run: |
        echo packing release of OPL ${{ env.OPL_VERSION }}
        cp INFO/* OPNPS2LD/
        cp INFO/* OPNPS2LD-VARIANTS/
        7z a -t7z OPNPS2LD-${{ env.OPL_VERSION }}.7z OPNPS2LD/*
        7z a -t7z OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z OPNPS2LD-VARIANTS/*
        7z a -t7z OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z OPNPS2LD-LANGS/*
        cp -f OPNPS2LD-${{ env.OPL_VERSION }}.7z OPNPS2LD.7z
        cp -f OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z OPNPS2LD-VARIANTS.7z
        cp -f OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z OPNPS2LD-LANGS.7z
        cp -f OPNPS2LD/OPNPS2LD-${{ env.OPL_VERSION }}.ELF OPNPS2LD.ELF

    - name: Create prerelease
      if: github.ref == 'refs/heads/362053534-patch-1'
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: "latest"
        title: "${{ env.OPL_VERSION }}"
        files: |
          OPNPS2LD-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD.7z
          OPNPS2LD-VARIANTS.7z
          OPNPS2LD-LANGS.7z
          OPNPS2LD.ELF

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: "${{ contains(github.ref, '-rc') }}"
        title: "${{ env.OPL_VERSION }}"
        files: |
          OPNPS2LD-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-VARIANTS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD-LANGS-${{ env.OPL_VERSION }}.7z
          OPNPS2LD.7z
          OPNPS2LD-VARIANTS.7z
          OPNPS2LD-LANGS.7z
          OPNPS2LD.ELF
