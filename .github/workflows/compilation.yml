name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Compile -> make clean release
      run: make --trace clean release

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload release artifact ELF
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: FGOPL
        path: |
          FGOPL-*.ELF

    - name: Build ISO
      env:
        PS2_SYSAREA_B64: ${{ secrets.PS2_SYSAREA_B64 }}
      run: |
        (apk add --no-cache xorriso || (apt-get update && apt-get install -y xorriso))
        mkdir -p iso_root
        cp FGOPL-*.ELF iso_root/FENG_001.29
        printf 'BOOT2 = cdrom0:\\FENG_001.29;1\r\nVER = 1.00\r\n' > iso_root/SYSTEM.CNF
        SYSAREA_OPT=""
        if [ -n "$PS2_SYSAREA_B64" ]; then
          printf '%s' "$PS2_SYSAREA_B64" | base64 -d > sysarea.bin
          SYSAREA_OPT="-G sysarea.bin"
        else
          echo "::warning::PS2_SYSAREA_B64 secret not set, ISO built without logo"
        fi
        xorriso -as mkisofs -o FGOPL-1.2.9.iso -V FGOPL-1.2.9 -sysid PLAYSTATION $SYSAREA_OPT -iso-level 1 iso_root

    - name: Upload release artifact ISO
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: FGOPL-ISO
        path: FGOPL-1.2.9.iso
        archive: false

    - name: Upload release artifact info
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: INFO
        path: |
          DETAILED_CHANGELOG
          CREDITS
          LICENSE
          README.md

  build-variants:
    strategy:
      fail-fast: false
      matrix:
        extra: [EXTRA_FEATURES=0, EXTRA_FEATURES=1]
        pademu: [PADEMU=0, PADEMU=1]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    - name: Compile -> make ${{ matrix.extra }} ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
      run: |
        make --trace ${{ matrix.pademu }} ${{ matrix.extra }} NOT_PACKED=1
        mv opl.elf FGOPL-${{ env.OPL_VERSION }}-${{ matrix.pademu }}-${{ matrix.extra }}.ELF

    - name: Create detailed changelog
      run: sh ./make_changelog.sh

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: FGOPL-VARIANTS ${{ matrix.pademu }} ${{ matrix.extra }}
        path: FGOPL*.ELF

  merge-variants:
    runs-on: ubuntu-latest
    needs: build-variants
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: FGOPL-VARIANTS
          pattern: FGOPL-VARIANTS*
          delete-merged: true

  build-lang:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew:main
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Compile -> make download_lng languages
      run: make --trace download_lng languages

    - name: Create artifact
      run: sh ./lng_pack.sh

    - name: Upload release artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: FGOPL-LANGS
        path: |
          FGOPL-LANGS-*.zip

  build-debug:
    strategy:
      fail-fast: false
      matrix:
        debug: [iopcore_debug, ingame_debug, eesio_debug, iopcore_ppctty_debug, ingame_ppctty_debug, DTL_T10000=1]
        # container_commit: [":main", "@sha256:7df074b3007f918b81f911e8b21fce1f297eff73ca03508064651ce2c8713570"] Replace with desired docker image hash or tag
        container_commit: [":main"]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/ps2homebrew${{ matrix.container_commit }}
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV
        SHORT_COMMIT="${{ matrix.container_commit }}"
        # Extract the last 4 characters
        SHORT_COMMIT=${SHORT_COMMIT: -4}
        echo "SHORT_COMMIT=$SHORT_COMMIT" >> $GITHUB_ENV

    - name: Compile -> make debug
      run: |
        make ${{ matrix.debug }} --trace
        mv opl.elf opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}.elf

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: opl-${{ matrix.debug }}-${{ env.OPL_VERSION }}-${{ env.SHORT_COMMIT }}
        path: opl-*.elf

  merge-debug:
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: FGOPL-DEBUG
          pattern: opl-*
          delete-merged: true

  release:
    needs: [build, merge-variants, build-lang]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/362053534-patch-1'
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
    - name: git checkout
      uses: actions/checkout@v6

    - run: git fetch --prune --unshallow

    - name: Get version
      run: |
        echo "OPL_VERSION=$(make oplversion)" >> $GITHUB_ENV

    # 只下载发布所需产物，避免无过滤下载全部（含debug/矩阵中间产物）导致超时失败
    - name: Download FGOPL
      uses: actions/download-artifact@v8
      with:
        name: FGOPL
        path: FGOPL

    - name: Download INFO
      uses: actions/download-artifact@v8
      with:
        name: INFO
        path: INFO

    - name: Download FGOPL-VARIANTS
      uses: actions/download-artifact@v8
      with:
        name: FGOPL-VARIANTS
        path: FGOPL-VARIANTS

    - name: Download FGOPL-LANGS
      uses: actions/download-artifact@v8
      with:
        name: FGOPL-LANGS
        path: FGOPL-LANGS

    - name: Prepare artifacts for release
      run: |
        echo packing release of OPL ${{ env.OPL_VERSION }}
        cp INFO/* FGOPL/
        cp INFO/* FGOPL-VARIANTS/
        7z a -t7z FGOPL-${{ env.OPL_VERSION }}.7z FGOPL/*
        7z a -t7z FGOPL-VARIANTS-${{ env.OPL_VERSION }}.7z FGOPL-VARIANTS/*
        7z a -t7z FGOPL-LANGS-${{ env.OPL_VERSION }}.7z FGOPL-LANGS/*
        cp -f FGOPL-${{ env.OPL_VERSION }}.7z FGOPL.7z
        cp -f FGOPL-VARIANTS-${{ env.OPL_VERSION }}.7z FGOPL-VARIANTS.7z
        cp -f FGOPL-LANGS-${{ env.OPL_VERSION }}.7z FGOPL-LANGS.7z
        cp -f FGOPL/FGOPL-${{ env.OPL_VERSION }}.ELF FGOPL.ELF

    - name: Create prerelease
      if: github.ref == 'refs/heads/362053534-patch-1'
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: true
        automatic_release_tag: "latest"
        title: "${{ env.OPL_VERSION }}"
        files: |
          FGOPL-${{ env.OPL_VERSION }}.7z
          FGOPL-VARIANTS-${{ env.OPL_VERSION }}.7z
          FGOPL-LANGS-${{ env.OPL_VERSION }}.7z
          FGOPL.7z
          FGOPL-VARIANTS.7z
          FGOPL-LANGS.7z
          FGOPL.ELF

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: "${{ contains(github.ref, '-rc') }}"
        title: "${{ env.OPL_VERSION }}"
        files: |
          FGOPL-${{ env.OPL_VERSION }}.7z
          FGOPL-VARIANTS-${{ env.OPL_VERSION }}.7z
          FGOPL-LANGS-${{ env.OPL_VERSION }}.7z
          FGOPL.7z
          FGOPL-VARIANTS.7z
          FGOPL-LANGS.7z
          FGOPL.ELF
